[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ita-options"
version = "0.1.0"
description = "Detección y backtest de arbitrajes de opciones sobre el sector Defensa (ITA)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.33.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
ita-options = "ita_options.pipeline:main"

[tool.setuptools.packages.find]
include = ["ita_options*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
